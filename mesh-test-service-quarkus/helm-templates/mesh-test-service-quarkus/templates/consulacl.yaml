{{- $mode := .Values.CONSUL_AUTH_MODE | default .Values.M2M_AUTH_MODE | default "legacy" | toString -}}
{{- if and (.Capabilities.APIVersions.Has "netcracker.com/v1/ConsulACL") (ne $mode "legacy") }}
{{- $namespace := .Release.Namespace }}
{{- $service := .Values.SERVICE }}
{{- $operatorNamespace := index (splitList "." (first (splitList ":" (last (splitList "://" .Values.CONSUL_URL))))) 1 }}
---
apiVersion: netcracker.com/v1
kind: ConsulACL
metadata:
  name: {{ $service }}
  namespace: {{ $namespace }}
spec:
  operatorNamespace: {{ $operatorNamespace | quote }}
  acl:
    name: {{ $namespace }}_{{ $service }}
    explicitName: true
    json: >
      {
         "policies":[
            {
               "Name":"{{ $namespace }}_{{ $service }}_v2",
               "Description":"{{ $namespace }}_{{ $service }} prefix policy",
               "Rules":"key_prefix \"config/{{ $namespace }}/{{ $service }}\" { policy = \"write\" }"
            },
            {
               "Name":"{{ $namespace }}_{{ $service }}_logging_v2",
               "Description":"{{ $namespace }}_{{ $service }}_logging prefix policy",
               "Rules":"key_prefix \"logging/{{ $namespace }}/{{ $service }}\" { policy = \"read\" }"
            }
         ],
         "roles":[
            {
               "Name":"{{ $namespace }}_{{ $service }}_v2",
               "Description":"{{ $namespace }}_{{ $service }} role",
               "policy_names":[
                  "{{ $namespace }}_global_shared_v2",
                  "{{ $namespace }}_{{ $service }}_v2",
                  "{{ $namespace }}_{{ $service }}_logging_v2",
                  "{{ $namespace }}_read_bluegreen_v2",
                  "{{ $namespace }}_read_composite_v2",
                  "{{ $namespace }}_read_global_v2",
                  "{{ $namespace }}_sessions_v2"
               ]
            }
         ]
      }
{{- end }}
