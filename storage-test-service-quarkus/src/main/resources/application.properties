quarkus.package.jar.type=legacy-jar
quarkus.http.port=8080
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, spanId=%X{spanId}, [%c{2.}] (%t) %s%e%n

deployment.version=${DEPLOYMENT_VERSION:v1}
cloud.microservice.bg_version=${DEPLOYMENT_VERSION:v1}
cloud.microservice.name=${MICROSERVICE_NAME:storage-test-service-quarkus}
cloud.microservice.namespace=${CLOUD_NAMESPACE:unknown}

maas.agent.url=${MAAS_AGENT_URL:http://maas-agent:8080}

quarkus.consul-source-config.enabled=${CONSUL_ENABLED:true}
quarkus.consul-source-config.agent.url=${CONSUL_URL:}
quarkus.consul-source-config.properties-root=config/${cloud.microservice.namespace}/application,config/${cloud.microservice.namespace}/${cloud.microservice.name}
quarkus.consul-source-config.m2m.enabled=false

# The suite talks to the cluster's own broker, so no container is to be started for it.
quarkus.kafka.devservices.enabled=false
