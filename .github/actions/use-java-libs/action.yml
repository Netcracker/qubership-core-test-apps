name: Use a java-libs build
description: >
  Installs a Build java-libs artifact into the local Maven repository and points the poms at its
  versions.

inputs:
  artifact:
    description: Artifact name from Build java-libs
    required: true
  path:
    description: Checkout whose tracked poms to rewrite
    required: false
    default: '.'

outputs:
  versions-file:
    description: JSON with the java-libs module versions
    value: ${{ steps.install.outputs.versions-file }}

runs:
  using: composite
  steps:
    - name: Download the java-libs build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/java-libs

    - name: Install the java-libs build into the local Maven repository
      id: install
      shell: bash
      run: |
        mkdir -p "$HOME/.m2/repository"
        tar -C "$HOME/.m2/repository" -xzf "$RUNNER_TEMP/java-libs/java-libs-m2.tar.gz"
        echo "versions-file=$RUNNER_TEMP/java-libs/java-libs-versions.json" >> "$GITHUB_OUTPUT"

    # MAVEN_ARGS (Maven 3.9+) applies -nsu to every later Maven call of the job
    - name: Keep Maven on the installed snapshots
      shell: bash
      run: echo "MAVEN_ARGS=${MAVEN_ARGS:+$MAVEN_ARGS }-nsu" >> "$GITHUB_ENV"

    - name: Rewrite the poms
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        VERSIONS: ${{ steps.install.outputs.versions-file }}
      run: |
        git ls-files -z '*pom.xml' \
          | xargs -0 --no-run-if-empty python3 "$GITHUB_ACTION_PATH/../../scripts/java-libs-versions.py" apply "$VERSIONS" \
          | tee "$RUNNER_TEMP/java-libs-changes.txt"
        {
          echo "## java-libs versions in use: ${{ inputs.path }}"
          echo ""
          echo '```'
          cat "$RUNNER_TEMP/java-libs-changes.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
