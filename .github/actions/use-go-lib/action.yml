# $schema: https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-action.json
name: "Use a go-lib build"
description: >
  Points a checkout at a local checkout of a qubership-core-lib-go-* module.
  The replace is the one the dependency gate uses to build a consumer:
  go mod edit -replace to that directory, then go mod tidy. in-graph is false
  when the checkout has no go.mod or does not depend on the module.
  lib-dir has to sit inside path: the service Dockerfiles copy path and then
  run go mod download, and a local replace is not fetched from the module proxy.

inputs:
  path:
    description: "Directory that holds the consumer go.mod"
    required: true
  lib-dir:
    description: "Checkout of the library module. A relative path is stored from path, so this directory must be inside path."
    required: true

outputs:
  in-graph:
    description: "Whether path depends on the library module, directly or transitively"
    value: ${{ steps.pin.outputs.in-graph || steps.root.outputs.in-graph }}
  module:
    description: "Module path of lib-dir, when in-graph"
    value: ${{ steps.pin.outputs.module }}

runs:
  using: composite
  steps:
    - name: Look for a go.mod
      id: root
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        if [ -f go.mod ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "in-graph=false" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ inputs.path }} has no go.mod, skipping"
        fi

    - name: Set up Go
      if: steps.root.outputs.present == 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: ${{ inputs.path }}/go.mod

    - name: Pin ${{ inputs.lib-dir }} into ${{ inputs.path }}
      id: pin
      if: steps.root.outputs.present == 'true'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        LIB: ${{ inputs.lib-dir }}
      run: |
        set -euo pipefail
        module="$(go -C "$GITHUB_WORKSPACE/$LIB" list -m)"
        echo "module=$module" >> "$GITHUB_OUTPUT"
        # same consumer test as dependency-gate/consumers.py: absent from go.sum, or present
        # there but not in the package graph, means this checkout does not build against it
        if [ ! -f go.sum ] || ! awk -v m="$module" 'NF && $1 == m { found=1 } END { exit !found }' go.sum; then
          echo "in-graph=false" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ inputs.path }} does not depend on $module"
          exit 0
        fi
        deps="$(go list -deps -test -f '{{with .Module}}{{.Path}}{{end}}' ./...)"
        if ! printf '%s\n' "$deps" | grep -Fxq "$module"; then
          echo "in-graph=false" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ inputs.path }} lists $module only in go.sum"
          exit 0
        fi
        rel="$(realpath --relative-to="$PWD" "$GITHUB_WORKSPACE/$LIB")"
        case "$rel" in
          /*|./*|../*) ;;
          *) rel="./$rel" ;;
        esac
        go mod edit -replace "$module=$rel"
        go mod tidy
        echo "in-graph=true" >> "$GITHUB_OUTPUT"
        {
          echo "## ${{ inputs.path }}: $module"
          echo ""
          echo "Replaced with \`$rel\`"
        } >> "$GITHUB_STEP_SUMMARY"
