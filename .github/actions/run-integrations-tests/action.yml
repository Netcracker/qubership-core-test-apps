name: Run integration tests from repository
description: >
  Checks out a repository, falls back to main when the requested branch is not
  available, and runs integration tests.

inputs:
  repository:
    description: Repository to check out
    required: true
  branch:
    description: Branch to check out before falling back to main
    required: false
    default: main
  path:
    description: Local checkout path
    required: true
  test-folder:
    description: Integration tests folder relative to the checkout path
    required: true
  test-service-name:
    description: Service name to use in the integration test runner
    required: true
  mesh-type:
    description: 'Mesh type for test services — Core or Istio'
    required: false
    default: 'Core'
  exec-mode:
    description: 'Executor mode for tests — EXEC_IN_POD or PORT_FORWARD'
    required: false
    default: 'PORT_FORWARD'
  java-libs-versions:
    description: >
      JSON file with qubership-core-java-libs versions, as use-java-libs-ref writes it. When set,
      the poms of the tests are pointed at those versions before they run.
    required: false
    default: ''
  github-token:
    description: GitHub token for Maven/GitHub Packages access
    required: true

runs:
  using: composite
  steps:
    - name: Checkout requested branch
      id: checkout-requested-branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      continue-on-error: true
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.branch }}
        path: ${{ inputs.path }}

    - name: Checkout main branch
      if: ${{ steps.checkout-requested-branch.outcome == 'failure' && inputs.branch != 'main' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ inputs.repository }}
        ref: main
        path: ${{ inputs.path }}

    - name: Point the tests at the java-libs versions under test
      if: ${{ inputs.java-libs-versions != '' }}
      shell: bash
      env:
        VERSIONS: ${{ inputs.java-libs-versions }}
        TESTS_DIR: ${{ inputs.path }}/${{ inputs.test-folder }}
      run: |
        find "$TESTS_DIR" -name pom.xml -not -path '*/target/*' -print0 \
          | xargs -0 --no-run-if-empty python3 "$GITHUB_ACTION_PATH/../../scripts/java-libs-versions.py" apply "$VERSIONS"

    - name: Run integration tests
      shell: bash
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CHECKOUT_PATH: ${{ inputs.path }}
        TEST_FOLDER: ${{ inputs.test-folder }}
      run: |
        ./run-it/run-integration-tests.sh \
          --exec-mode "${{ inputs.exec-mode }}" \
          kind-kind \
          core \
          kind-control-plane:10.244.0.1 \
          "${{ inputs.test-service-name }}:${CHECKOUT_PATH}/${TEST_FOLDER}"
