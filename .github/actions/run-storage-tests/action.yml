name: Run storage integration tests
description: >
  Installs the storage test service and runs the storage failover integration tests.

inputs:
  namespace:
    description: Kubernetes namespace to install the storage test service into
    required: false
    default: core
  spring-tag:
    description: >
      Docker image tag for storage-test-service-spring. Empty derives it from the ref: latest on
      main, <ref>-snapshot elsewhere, since latest is only built from main.
    required: false
    default: ''
  dbaas-agent-url:
    description: Address of the DBaaS agent the client under test talks to
    required: false
    default: http://dbaas-agent:8080
  scenarios:
    description: >
      Tests to run, as a JUnit selector; empty runs the whole suite. Example: PostgresStorageIT.
    required: false
    default: ''
  cleanup:
    description: >
      Uninstall the test service when the run ends. Only worth doing when the cluster is short on
      resources: otherwise leaving it in place lets the workflow collect its state at the end.
    required: false
    default: 'false'
  github-token:
    description: GitHub token for pulling images
    required: true

runs:
  using: composite
  steps:
    - name: Run storage integration tests
      shell: bash
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NAMESPACE: ${{ inputs.namespace }}
        SPRING_TAG: ${{ inputs.spring-tag }}
        DBAAS_AGENT_URL: ${{ inputs.dbaas-agent-url }}
        SCENARIOS: ${{ inputs.scenarios }}
      run: |
        set -e
        TAG="$SPRING_TAG"
        if [ -z "$TAG" ]; then
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="latest"
          else
            # slashes are legal in a ref name but not in a tag: pull_request gives '<number>/merge'
            TAG="${GITHUB_REF_NAME//\//-}-snapshot"
          fi
        fi
        echo "Installing storage-test-service-spring:$TAG"
        ./storage-test-install/storage-test-apps.sh install \
            --namespace "$NAMESPACE" --dbaas-agent "$DBAAS_AGENT_URL" --spring-tag "$TAG"

        # -Dtest selects scenarios; the runner passes the rest of the maven arguments through
        if [ -n "$SCENARIOS" ]; then
          export MAVEN_OPTS_EXTRA="-Dtest=$SCENARIOS"
        fi
        ./run-it/run-integration-tests.sh kind-kind "$NAMESPACE" kind-control-plane:10.244.0.1 \
            storage-test-service-spring:storage-integration-tests

    - name: Uninstall the storage test service
      if: always() && inputs.cleanup == 'true'
      shell: bash
      run: ./storage-test-install/storage-test-apps.sh uninstall --namespace ${{ inputs.namespace }}
