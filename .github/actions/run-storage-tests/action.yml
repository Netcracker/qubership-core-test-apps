name: Run storage integration tests
description: >
  Installs the storage test services and runs the storage failover integration tests.

inputs:
  namespace:
    description: Kubernetes namespace to install the storage test services into
    required: false
    default: core
  apps:
    description: Comma-separated platforms to install and test, for example "spring,go"
    required: false
    default: spring,go,quarkus
  tag:
    description: >
      Docker image tag for the test services. Empty derives it from the ref: latest on main,
      <ref>-snapshot elsewhere, since latest is only built from main.
    required: false
    default: ''
  dbaas-agent-url:
    description: Address of the DBaaS agent the client under test talks to
    required: false
    default: http://dbaas-agent:8080
  maas-agent-url:
    description: Address of the MaaS agent the client under test talks to
    required: false
    default: http://maas-agent:8080
  cleanup:
    description: >
      Uninstall the test services when the run ends. Only worth doing when the cluster is short on
      resources: otherwise leaving them in place lets the workflow collect their state at the end.
    required: false
    default: 'false'
  github-token:
    description: GitHub token for pulling images
    required: true

runs:
  using: composite
  steps:
    - name: Run storage integration tests
      shell: bash
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NAMESPACE: ${{ inputs.namespace }}
        APPS: ${{ inputs.apps }}
        IMAGE_TAG: ${{ inputs.tag }}
        DBAAS_AGENT_URL: ${{ inputs.dbaas-agent-url }}
        MAAS_AGENT_URL: ${{ inputs.maas-agent-url }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        set -e
        TAG="$IMAGE_TAG"
        if [ -z "$TAG" ]; then
          if [ "$BRANCH" = "main" ]; then
            TAG="latest"
          else
            # the image is tagged with slashes replaced, so feat/x becomes feat-x-snapshot
            TAG="${BRANCH//\//-}-snapshot"
          fi
        fi
        echo "Installing storage test services ($APPS) with tag $TAG"
        ./storage-test-install/storage-test-apps.sh install \
            --namespace "$NAMESPACE" --apps "$APPS" --tag "$TAG" \
            --dbaas-agent "$DBAAS_AGENT_URL" --maas-agent "$MAAS_AGENT_URL"

        ./run-it/run-integration-tests.sh kind-kind "$NAMESPACE" kind-control-plane:10.244.0.1 \
            storage-test-apps:storage-integration-tests

    - name: Uninstall the storage test services
      if: always() && inputs.cleanup == 'true'
      shell: bash
      run: >
        ./storage-test-install/storage-test-apps.sh uninstall
        --namespace ${{ inputs.namespace }} --apps ${{ inputs.apps }}
