name: Setup Kind cluster
description: >
  Spins up a Kind cluster, installs required tooling, and checks out the
  qubership-core-bootstrap repo into core-bootstrap-repo, from where the
  actions that install into the cluster take their Makefile.

inputs:
  core-bootstrap-branch:
    description: Branch of the qubership-core-bootstrap repo to check out
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Add cluster.local to hosts
      shell: bash
      run: |
        echo "127.0.0.1 cluster.local" | sudo tee -a /etc/hosts

    - name: Set up Kind
      uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      with:
        cluster_name: kind

    # Install Helm 4 - required by core-mesh-config
    - name: Install Helm 4
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      with:
         version: v4.3.2

    - name: Set up kubectl
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5

    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
      with:
        java-version: '21'
        distribution: temurin

    - name: Checkout cloud core bootstrap repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: Netcracker/qubership-core-bootstrap
        ref: ${{ inputs.core-bootstrap-branch }}
        path: core-bootstrap-repo
