name: Setup Kind cluster and deploy Cloud Core
description: >
  Spins up a Kind cluster, installs required tooling, checks out the
  qubership-core-bootstrap repo, and deploys Cloud Core with Core or Istio service mesh.
  The branches, tags and images of the core services and of the dependencies are resolved by the
  bootstrap and printed at the top of its log, so this action only passes on what a suite has to
  change: everything but the inputs below goes in aux-bootstrap-args.

inputs:
  core-bootstrap-branch:
    description: Branch of the qubership-core-bootstrap repo to check out
    required: false
    default: main
  test-branch:
    description: >
      Branch to use in the repositories of the core services; a repository that has no such branch
      stays on the baseline of the bootstrap, which is main. Empty leaves the choice to the bootstrap.
    required: false
    default: ''
  mesh-type:
    description: 'Mesh type for test services — Core or Istio'
    required: false
    default: 'Core'
  install-maas:
    description: Whether to install MaaS (also sets CORE_CONFIG_MAAS_ENABLED)
    required: false
    default: 'false'
  install-istio:
    description: Whether to install Istio
    required: false
    default: 'true'
  aux-bootstrap-args:
    description: >
      Extra variables passed to the cloud-core local-dev make target, space separated, as
      KEY=VALUE, and applied last, so they override everything above. This is where anything else
      goes: the tag of a core service (CONFIG_SERVER_TAG=my-tag), the branch or tag of a dependency
      (DBAAS_REPO_BRANCH=main, MAAS_BRANCH=main, ISTIO_REPO_BRANCH=main,
      CORE_MESH_CONFIG_REPO_BRANCH=main), M2M_AUTH_MODE=hybrid, or a setting only one suite needs
      (PATRONI_REPLICAS_NUMBER=2 RABBIT_INSTANCES=rabbitmq-1).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Kind cluster
      uses: ./.github/actions/setup-kind
      with:
        core-bootstrap-branch: ${{ inputs.core-bootstrap-branch }}

    - name: Deploy cloud core
      uses: ./.github/actions/deploy-cloud-core
      with:
        test-branch: ${{ inputs.test-branch }}
        mesh-type: ${{ inputs.mesh-type }}
        install-maas: ${{ inputs.install-maas }}
        install-istio: ${{ inputs.install-istio }}
        aux-bootstrap-args: ${{ inputs.aux-bootstrap-args }}
