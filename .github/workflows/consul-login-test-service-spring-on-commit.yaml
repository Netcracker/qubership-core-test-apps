name: Consul-login-test-service-spring build

on:
  push:
    paths:
      - 'consul-login/test-service-spring/**'
      - '.github/workflows/consul-login-test-service-spring-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'consul-login/test-service-spring/**'
      - '.github/workflows/consul-login-test-service-spring-on-commit.yaml'
jobs:
  build:
    uses: netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@8a233b03c5b5355d59c1585ffdaa1f45ea816405 # v2.6.1
    with:
      maven-command: 'verify'
      pom-file: consul-login/test-service-spring/pom.xml
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      ref: ${{ github.ref }}
      skip-docker: true
    secrets: inherit
