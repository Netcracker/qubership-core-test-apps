name: Consul-login-test-service-spring build

on:
  push:
    paths:
      - 'consul-login-test-service-spring/**'
      - '.github/consul-login-test-service-spring-docker-config.json'
      - '.github/workflows/consul-login-test-service-spring-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'consul-login-test-service-spring/**'
      - '.github/consul-login-test-service-spring-docker-config.json'
      - '.github/workflows/consul-login-test-service-spring-on-commit.yaml'
jobs:
  mvn:
    uses: netcracker/qubership-core-infra/.github/workflows/maven-build-with-sonar.yaml@e8322e6ee168795edec1d103e289b3fe3ceb805d # v2.6.0
    with:
      event-name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      upload-artifact: true
      pom-file-path: consul-login-test-service-spring/pom.xml
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    needs: [mvn]
    uses: netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@e8322e6ee168795edec1d103e289b3fe3ceb805d # v2.6.0
    with:
      dry-run: false
      config-filename: consul-login-test-service-spring-docker-config.json
