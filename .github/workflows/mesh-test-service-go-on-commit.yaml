name: Mesh-test-service-go build

on:
  push:
    paths:
      - 'mesh-test-service-go/**'
      - '.github/mesh-test-service-go-docker-config.json'
      - '.github/workflows/mesh-test-service-go-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'mesh-test-service-go/**'
      - '.github/mesh-test-service-go-docker-config.json'
      - '.github/workflows/mesh-test-service-go-on-commit.yaml'

jobs:
  build:
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@8a233b03c5b5355d59c1585ffdaa1f45ea816405 # v2.6.1
    with:
      go-module-dir: mesh-test-service-go/test-service-go
      docker-config-file: mesh-test-service-go-docker-config.json
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets: inherit
