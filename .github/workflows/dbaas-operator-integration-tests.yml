name: DBaaS Operator integration tests

# Proves that Cloud Core services resolve their databases through the DBaaS Operator, with no
# REST fallback: an Istio waypoint denies the DBaaS REST API to Cloud Core and counts every call it
# denies, so a service only passes if it found its database in the Secret the operator mounted.
# See dbaas-operator-tests/README.md.

on:
  workflow_dispatch:
    inputs:
      test-branch:
        description: Branch of the Core service repositories; empty, or a repository without it, means main
        required: false
        default: ''
      scenarios:
        description: Comma-separated subset of clean-install, upgrade
        required: false
        default: clean-install,upgrade
  workflow_call:
    inputs:
      test-branch:
        type: string
        required: false
        default: ''
      scenarios:
        type: string
        required: false
        default: clean-install,upgrade

permissions:
  contents: read

env:
  LOGS_FOR: name=control-plane,name=config-server,name=site-management,name=dbaas-agent,name=dbaas-operator

jobs:
  # A: install Cloud Core on a cluster that already runs the DBaaS Operator.
  clean-install:
    if: contains(inputs.scenarios, 'clean-install')
    runs-on: ubuntu-latest
    env:
      REPORT_DIR: artifacts/dbaas-operator-clean-install
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The trap must be in place before Cloud Core starts, so the dependencies and Cloud Core are
      # installed in two runs, with the trap in between. The bootstrap puts the namespaces in the mesh
      # first: MESH_DEPENDENCY_NAMESPACES gives DBaaS a waypoint, which enforces the trap, and
      # enable-early-core-mesh (CORE_MESH_EARLY) puts the Cloud Core namespace in the mesh now, so
      # the probe and every Cloud Core pod are captured. deploy-core repeats it, which changes nothing.
      - name: Setup Kind cluster and deploy Istio and DBaaS with the DBaaS Operator
        uses: ./.github/actions/setup-kind-with-cloud-core
        with:
          test-branch: ${{ inputs.test-branch }}
          mesh-type: Istio
          make-targets: install-dependencies ensure-core-namespace enable-early-core-mesh
          aux-bootstrap-args: >-
            DBAAS_OPERATOR_ENABLED=true
            CORE_MESH_EARLY=true
            MESH_DEPENDENCY_NAMESPACES=dbaas

      - name: Deny the DBaaS REST API to Cloud Core
        run: ./dbaas-operator-tests/checks.sh arm

      - name: Deploy Cloud Core
        run: >-
          make -C core-bootstrap-repo/cloud-core-local-dev/ deploy-core
          INSTALL_ISTIO=true SERVICE_MESH_TYPE=Istio
          DBAAS_OPERATOR_ENABLED=true
          CORE_MESH_EARLY=true
          ${{ inputs.test-branch && format('TEST_BRANCH={0}', inputs.test-branch) || '' }}

      - name: Check databases come from the DBaaS Operator
        run: ./dbaas-operator-tests/checks.sh assert --expect-no-legacy-secret

      - name: Collect diagnostics
        if: failure()
        uses: ./.github/actions/collect-k8s-diagnostics
        with:
          collect-logs-for: ${{ env.LOGS_FOR }}
          artifact-suffix: -dbaas-operator-clean-install

      - name: Write Surefire report
        if: always()
        run: ./dbaas-operator-tests/checks.sh report dbaas-operator.clean-install --job-status "${{ job.status }}"

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: surefire-reports-dbaas-operator-clean-install
          path: artifacts/*

  # B: install Cloud Core without the DBaaS Operator, then add the operator and upgrade Cloud Core
  # onto it.
  # The databases created over REST must be adopted, not replaced.
  upgrade:
    if: contains(inputs.scenarios, 'upgrade')
    runs-on: ubuntu-latest
    env:
      REPORT_DIR: artifacts/dbaas-operator-upgrade
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Kind cluster and deploy Cloud Core without the DBaaS Operator
        uses: ./.github/actions/setup-kind-with-cloud-core
        with:
          mesh-type: Istio

      # Taken before the trap is armed: the lookup asks dbaas-aggregator from the Cloud Core namespace.
      - name: Record each service's database
        run: ./dbaas-operator-tests/checks.sh snapshot "$RUNNER_TEMP/databases-before.json"

      - name: Install the DBaaS Operator into the running DBaaS
        # deploy-dbaas would rerun the whole DBaaS install, and its Patroni re-apply fails on a field
        # conflict with postgres-operator. Install only the operator, from the clone the first install left.
        # REPOS_DIR is where core-bootstrap cloned the repositories; it passes the same absolute path.
        run: >-
          make -C core-bootstrap-repo/cloud-core-local-dev/.tmp/qubership-dbaas/bootstrap
          install-dbaas-operator wait-dbaas-operator DBAAS_OPERATOR_ENABLED=true
          REPOS_DIR="$GITHUB_WORKSPACE/core-bootstrap-repo/cloud-core-local-dev/.tmp"

      # The baseline install already put the Cloud Core namespace in the mesh (core-mesh-config).
      # DBaaS joins it now, behind the waypoint that enforces the trap; its pods join without a restart.
      - name: Put DBaaS in the mesh, behind a waypoint
        run: >-
          make -C core-bootstrap-repo/cloud-core-local-dev/ deploy-dependency-waypoints
          INSTALL_ISTIO=true MESH_DEPENDENCY_NAMESPACES=dbaas

      - name: Deny the DBaaS REST API to Cloud Core
        run: ./dbaas-operator-tests/checks.sh arm

      - name: Upgrade Cloud Core onto the DBaaS Operator
        run: >-
          make -C core-bootstrap-repo/cloud-core-local-dev/ clone-repos template-values-files deploy-core
          INSTALL_ISTIO=true SERVICE_MESH_TYPE=Istio
          DBAAS_OPERATOR_ENABLED=true
          ${{ inputs.test-branch && format('TEST_BRANCH={0}', inputs.test-branch) || '' }}

      - name: Check the existing databases were adopted
        run: ./dbaas-operator-tests/checks.sh assert --snapshot "$RUNNER_TEMP/databases-before.json"

      - name: Collect diagnostics
        if: failure()
        uses: ./.github/actions/collect-k8s-diagnostics
        with:
          collect-logs-for: ${{ env.LOGS_FOR }}
          artifact-suffix: -dbaas-operator-upgrade

      - name: Write Surefire report
        if: always()
        run: ./dbaas-operator-tests/checks.sh report dbaas-operator.upgrade --job-status "${{ job.status }}"

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: surefire-reports-dbaas-operator-upgrade
          path: artifacts/*
