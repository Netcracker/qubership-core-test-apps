name: Integration tests for a java-libs ref
run-name: "[java-libs=${{ inputs.java-libs-ref }}] [tests=${{ inputs.run-tests-for }}]"

# Runs the suites that exercise qubership-core-java-libs against a branch, tag, commit or pull
# request of it, before that change is released. Nothing is published:
#   1. java-libs is built at the ref and handed on as an artifact (build-java-libs.yml);
#   2. every Java service that uses it is built against it (the Maven action of core-infra's
#      builds, then docker/build-push-action) into a docker image saved as an artifact, tagged
#      java-libs-<commit>: the Java services of Cloud Core (config-server, core-operator,
#      dbaas-aggregator) and the Java mesh test services;
#   3. the suites load those images into their cluster and point the tags of these components at
#      them. The Java test services the consul-login suite builds itself, and every integration
#      test module, are built against the same java-libs build.
# The Go components run their published images: they do not use java-libs.
#
# Suites: the mesh tests (integration-tests.yml; the Java test services and Cloud Core) and the
# consul-login tests (Quarkus and Spring consul config libraries). The paas-mediation,
# control-plane, site-management and maas-agent suites of integration-tests.yml test Go services
# and are left out unless run-tests-for names them. The MaaS failover suite (maas-client) is not
# wired in yet: it pins the MaaS tag its own way, apart from the images built here.

on:
  workflow_dispatch:
    inputs:
      java-libs-ref:
        description: 'qubership-core-java-libs branch, tag, commit or PR number (204, #204)'
        required: true
        type: string
      services-branch:
        description: 'Branch of the services and test repositories (config-server, core-operator, dbaas, integration tests); main where it does not exist'
        required: false
        default: 'main'
        type: string
      core-bootstrap-branch:
        description: 'Branch of core-bootstrap repo'
        required: false
        default: 'main'
        type: string
      run-tests-for:
        description: 'Suites of integration-tests.yml: mesh-tests by default, or all, or comma-separated names (mesh-tests,paas-mediation,control-plane,site-management,maas-agent)'
        required: false
        default: 'mesh-tests'
        type: string
      consul-login:
        description: 'Run the consul-login suite'
        required: false
        default: true
        type: boolean

jobs:
  java-libs:
    uses: ./.github/workflows/build-java-libs.yml
    with:
      java-libs-ref: ${{ inputs.java-libs-ref }}

  images:
    needs: java-libs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # repository: empty for this repository. maven-dir: where the pom to build is, dockerfile
        # and context: as the service's own docker config has them, relative to the checkout.
        # retag: published images whose chart takes the same tag, carried along unchanged.
        include:
          - name: config-server
            repository: Netcracker/qubership-core-config-server
            maven-dir: .
            java-version: '21'
            dockerfile: Dockerfile
            context: .
            image: ghcr.io/netcracker/qubership-core-config-server
          - name: core-operator
            repository: Netcracker/qubership-core-core-operator
            maven-dir: .
            java-version: '21'
            dockerfile: Dockerfile
            context: .
            image: ghcr.io/netcracker/qubership-core-core-operator
          # the dbaas bootstrap uses one TAG for the aggregator and its declarative hook image
          - name: dbaas-aggregator
            repository: Netcracker/qubership-dbaas
            maven-dir: .
            java-version: '25'
            dockerfile: dbaas/Dockerfile
            context: dbaas
            image: ghcr.io/netcracker/qubership-dbaas
            retag: ghcr.io/netcracker/qubership-dbaas-validation-image
          - name: mesh-test-service-spring
            repository: ''
            maven-dir: mesh-test-service-spring
            java-version: '21'
            dockerfile: mesh-test-service-spring/Dockerfile
            context: mesh-test-service-spring
            image: ghcr.io/netcracker/qubership-core-mesh-test-service-spring
          - name: mesh-test-service-quarkus
            repository: ''
            maven-dir: mesh-test-service-quarkus
            java-version: '21'
            dockerfile: mesh-test-service-quarkus/Dockerfile
            context: mesh-test-service-quarkus
            image: ghcr.io/netcracker/qubership-core-mesh-test-service-quarkus
    env:
      # where the sources of the service are: its own checkout, or this repository
      SOURCES: ${{ matrix.repository != '' && 'service' || '.' }}
      TAG: ${{ needs.java-libs.outputs.image-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve the branch of ${{ matrix.repository }}
        id: branch
        if: ${{ matrix.repository != '' }}
        env:
          REPOSITORY: ${{ matrix.repository }}
          BRANCH: ${{ inputs.services-branch }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$REPOSITORY.git" "$BRANCH" > /dev/null; then
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$REPOSITORY has no branch $BRANCH, building main"
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out ${{ matrix.repository }}
        if: ${{ matrix.repository != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ steps.branch.outputs.branch }}
          path: service
          persist-credentials: false

      - name: Point ${{ matrix.name }} at the java-libs build
        uses: ./.github/actions/use-java-libs
        with:
          artifact: ${{ needs.java-libs.outputs.artifact }}
          path: ${{ env.SOURCES }}

      # The Maven step of core-infra's generic-maven-build, without its checkout: the sources are
      # the ones rewritten above, possibly of another repository
      - name: Build ${{ matrix.name }}
        uses: netcracker/qubership-workflow-hub/actions/maven-snapshot-deploy@6b356d28e46b2d4683cccb1d91f92643d7f0c513 # v2.0.11
        with:
          java-version: ${{ matrix.java-version }}
          working-directory: ${{ env.SOURCES }}/${{ matrix.maven-dir }}
          target-store: github
          maven-command: package
          additional-mvn-args: '-ntp -DskipTests'
          upload-artifact: 'false'

      # The builder qubership-workflow-hub's docker-action uses, loading the image into the local
      # docker instead of pushing it: the image travels to the test cluster as an artifact.
      - name: Build the image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ env.SOURCES }}/${{ matrix.context }}
          file: ${{ env.SOURCES }}/${{ matrix.dockerfile }}
          provenance: false
          push: false
          load: true
          tags: ${{ matrix.image }}:${{ env.TAG }}

      - name: Carry ${{ matrix.retag }} along under the same tag
        if: ${{ matrix.retag }}
        env:
          RETAG: ${{ matrix.retag }}
        run: |
          docker pull "$RETAG:latest"
          docker tag "$RETAG:latest" "$RETAG:$TAG"

      - name: Save the image
        env:
          IMAGE: ${{ matrix.image }}
          RETAG: ${{ matrix.retag }}
        run: |
          # shellcheck disable=SC2086 # RETAG is empty or one image
          docker save -o "${{ matrix.name }}.tar" "$IMAGE:$TAG" ${RETAG:+"$RETAG:$TAG"}
          {
            echo "Built \`$IMAGE:$TAG\`"
            if [ -n "$RETAG" ]; then echo "Carried \`$RETAG:latest\` along as \`$RETAG:$TAG\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: java-libs-image-${{ matrix.name }}
          path: ${{ matrix.name }}.tar
          retention-days: 1

  core-mesh:
    needs: [java-libs, images]
    uses: ./.github/workflows/integration-tests.yml
    with:
      java-libs-artifact: ${{ needs.java-libs.outputs.artifact }}
      images-artifact-pattern: java-libs-image-*
      config-server-tag: ${{ needs.java-libs.outputs.image-tag }}
      core-operator-tag: ${{ needs.java-libs.outputs.image-tag }}
      mesh-test-spring-tag: ${{ needs.java-libs.outputs.image-tag }}
      mesh-test-quarkus-tag: ${{ needs.java-libs.outputs.image-tag }}
      # dbaas-aggregator and its hook image: the dbaas bootstrap takes the plain TAG
      aux-bootstrap-args: TAG=${{ needs.java-libs.outputs.image-tag }}
      test-branch: ${{ inputs.services-branch }}
      core-bootstrap-branch: ${{ inputs.core-bootstrap-branch }}
      install-istio: false
      install-maas: true
      mesh-type: 'Core'
      test-usecase: 'core-mesh'
      run-tests-for: ${{ inputs.run-tests-for }}

  # builds its test services itself, from this repository, against the java-libs build
  consul-login:
    needs: java-libs
    if: ${{ inputs.consul-login }}
    uses: ./.github/workflows/consul-login-integration-tests.yml
    with:
      java-libs-artifact: ${{ needs.java-libs.outputs.artifact }}
      core-bootstrap-branch: ${{ inputs.core-bootstrap-branch }}

  # The suites keep going when a test fails, so that every report is collected: the verdict on
  # the java-libs ref is given here, from the reports of all of them.
  verdict:
    needs: [java-libs, images, core-mesh, consul-login]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the test reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: surefire-reports*
          path: reports

      - name: Sum up the test reports
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          set -e
          {
            echo "## java-libs ${{ inputs.java-libs-ref }}: test results"
            echo ""
            echo "| Suite | Tests | Failed | Errors | Skipped |"
            echo "| --- | ---: | ---: | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=0
          shopt -s nullglob
          for suite in reports/*/*/; do
            tests=0 failures=0 errors=0 skipped=0
            for f in "$suite"surefire-reports/TEST-*.xml; do
              line=$(grep -o '<testsuite [^>]*>' "$f" | head -n1)
              for k in tests failures errors skipped; do
                v=$(echo "$line" | sed -n "s/.* $k=\"\([0-9]*\)\".*/\1/p")
                eval "$k=\$(( $k + ${v:-0} ))"
              done
            done
            echo "| $(basename "$suite") | $tests | $failures | $errors | $skipped |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$tests" -eq 0 ] || [ $((failures + errors)) -gt 0 ]; then bad=1; fi
          done
          # a job that failed or was skipped for a failure has no reports to show
          failed_jobs=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$failed_jobs" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Failed jobs: $(echo $failed_jobs)" >> "$GITHUB_STEP_SUMMARY"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "::error::Tests failed against java-libs ${{ inputs.java-libs-ref }}, see the summary"
            exit 1
          fi
