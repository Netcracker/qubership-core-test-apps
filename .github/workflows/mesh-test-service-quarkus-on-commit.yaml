name: Mesh-test-service-quarkus build

on:
  push:
    paths:
      - 'mesh-test-service-quarkus/**'
      - '.github/mesh-test-service-quarkus-docker-config.json'
      - '.github/workflows/mesh-test-service-quarkus-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'mesh-test-service-quarkus/**'
      - '.github/mesh-test-service-quarkus-docker-config.json'
      - '.github/workflows/mesh-test-service-quarkus-on-commit.yaml'

jobs:
  mvn:
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@8a233b03c5b5355d59c1585ffdaa1f45ea816405 # v2.6.1
    with:
      pom-file: mesh-test-service-quarkus/pom.xml
      # A pull request validates only; main publishes the snapshot.
      maven-command: ${{ github.event_name == 'pull_request' && 'verify' || 'deploy' }}
      # The Docker context is ./artifacts/mesh-test-service-quarkus/, so the build
      # needs the uploaded Maven artifact.
      upload-artifact: 'true'
      docker-config-file: mesh-test-service-quarkus-docker-config.json
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets: inherit
