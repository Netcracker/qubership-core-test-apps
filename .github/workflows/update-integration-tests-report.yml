name: Generate Test Report
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # every day at 01:00

permissions:
  pages: write
  id-token: write

concurrency:
  group: "integration-tests-report"
  cancel-in-progress: true

env:
  # Report content and the called integration tests run from this branch, and results are NOT published
  # to GitHub Pages while it is set, so the dashboard keeps main results only.
  # Set to '' to go back to the triggering ref and publish again.
  TEST_APPS_BRANCH: fix/integration-tests

jobs:
  run-tests-core-mesh:
    uses: ./.github/workflows/integration-tests.yml
    with:
      install-istio: false
      install-maas: true
      mesh-type: 'Core'
      test-usecase: 'core-mesh'
      run-tests-for: 'all'

  run-tests-istio-mesh-fallback-mode:
    uses: ./.github/workflows/integration-tests.yml
    with:
      install-istio: true
      install-maas: true
      mesh-type: 'Core'
      test-usecase: 'istio-fallback'
      run-tests-for: 'all'

  run-tests-istio-mesh-migrated-mode:
    uses: ./.github/workflows/integration-tests.yml
    with:
      install-istio: true
      install-maas: true
      mesh-type: 'Istio'
      test-usecase: 'istio-migrated'
      run-tests-for: 'all'            
      
  update-report:
    needs: [run-tests-core-mesh, run-tests-istio-mesh-fallback-mode, run-tests-istio-mesh-migrated-mode]
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish_decision.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TEST_APPS_BRANCH }}

      - name: Download Surefire reports artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: surefire-reports*
          merge-multiple: true

      - name: Update report
        run: |
          today=$(date +%Y-%m-%d)
          mkdir -p report/reports
          successes=0
          failures=0
          
          history_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json"
          job_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if ! curl -s -f -o report/history.json "$history_url"; then
            echo "No history.json found, create a new one"
            echo "{}" > report/history.json
          fi
          
          for artifact in artifacts/*; do
            modname=$(basename "$artifact")
            echo "Processing artifact for $modname"
            mod_succ=0
            mod_fail=0
          
            for f in "$artifact"/surefire-reports/TEST-*.xml; do
              [ -f "$f" ] || continue
              line=$(grep -o '<testsuite[^>]*>' "$f" | head -n1 || true)
              tests=$(echo "$line" | sed -n 's/.*tests="\([0-9]\+\)".*/\1/p')
              fails=$(echo "$line" | sed -n 's/.*failures="\([0-9]\+\)".*/\1/p')
              errs=$(echo "$line" | sed -n 's/.*errors="\([0-9]\+\)".*/\1/p')
              skipped=$(echo "$line" | sed -n 's/.*skipped="\([0-9]\+\)".*/\1/p')
              tests=${tests:-0}; fails=${fails:-0}; errs=${errs:-0}; skipped=${skipped:-0}
              mod_succ=$((mod_succ + tests - fails - errs - skipped))
              mod_fail=$((mod_fail + fails + errs))
            done
          
            successes=$((successes + mod_succ))
            failures=$((failures + mod_fail))
          
            if [ -f "$artifact/reports/surefire.html" ]; then
              mkdir -p report/reports/$modname
              cp -r "$artifact/reports/"* report/reports/$modname/
              mv "report/reports/$modname/surefire.html" "report/reports/$modname/index.html" 
            fi
          
            jq --arg date "$today" \
              --arg proj "$modname" \
              --arg succ "$mod_succ" \
              --arg fail "$mod_fail" \
              --arg job "$job_url" \
              --arg p "reports/$modname/" \
              '
             .[$date] //= {}
             | .[$date].job = $job
             | .[$date].projects //= []
             | .[$date].projects |= map(select(.name != $proj))
             | .[$date].projects |= (
                 . + [{
                   name: $proj,
                   successes: ($succ|tonumber),
                   failures: ($fail|tonumber),
                   path: $p
                 }]
               )
             ' \
              report/history.json > report/tmp.json && mv report/tmp.json report/history.json
          done
          
          cutoff=$(date -d "7 days ago" +%Y-%m-%d)
          jq --arg cutoff "$cutoff" 'with_entries(select(.key > $cutoff))' \
          report/history.json > report/tmp.json && mv report/tmp.json report/history.json
          
          cp integration-tests-report/report-template.html report/index.html

      - name: Decide whether the report may be published
        id: publish_decision
        shell: bash
        run: |
          # runs against a pinned dev branch stay off the public dashboard
          if [ -z "${{ env.TEST_APPS_BRANCH }}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Report built from branch '${{ env.TEST_APPS_BRANCH }}', publishing to GitHub Pages is skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report as artifact (dev branch run, not published)
        if: ${{ env.TEST_APPS_BRANCH != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-tests-report
          path: './report'

      - name: Setup Pages
        if: ${{ env.TEST_APPS_BRANCH == '' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact for Pages
        if: ${{ env.TEST_APPS_BRANCH == '' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './report'

  publish-report:
    needs: update-report
    if: ${{ needs.update-report.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
