name: Storage-test-service-go build

on:
  push:
    paths:
      - 'storage-test-service-go/**'
      - '.github/storage-test-service-go-docker-config.json'
      - '.github/workflows/storage-test-service-go-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'storage-test-service-go/**'
      - '.github/storage-test-service-go-docker-config.json'
      - '.github/workflows/storage-test-service-go-on-commit.yaml'

jobs:
  # The Dockerfile compiles the module, so the image build is also the build check.
  docker-build:
    uses: netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@32a5b506971a029acc41bc69fd42d06137caeb36 # v1.3.3
    with:
      dry-run: false
      config-filename: storage-test-service-go-docker-config.json
