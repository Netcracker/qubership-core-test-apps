name: Maas-failover-test-apps-java build

# One build for the Java failover test applications: the shared module has to be compiled before
# the applications that depend on it, and the reactor is what guarantees that ordering.
#
# No image is published: the integration test job builds it from the commit it runs on.

on:
  push:
    paths:
      - 'maas-failover-resilience/test-apps-java/**'
      - 'maas-failover-resilience/test-service-common/**'
      - 'maas-failover-resilience/test-service-spring/**'
      - '.github/workflows/maas-failover-test-apps-java-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'maas-failover-resilience/test-apps-java/**'
      - 'maas-failover-resilience/test-service-common/**'
      - 'maas-failover-resilience/test-service-spring/**'
      - '.github/workflows/maas-failover-test-apps-java-on-commit.yaml'

jobs:
  mvn:
    uses: netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@ed95ad948025728db1e613a3e1a4e6a11186f541 # v2.6.2
    with:
      maven-command: 'verify'
      pom-file: 'maas-failover-resilience/test-apps-java/pom.xml'
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      skip-docker: true
    secrets: inherit
