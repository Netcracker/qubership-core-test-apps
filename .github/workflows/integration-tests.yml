name: Run integration tests
run-name: >-
  [Istio=${{ (inputs.install-istio && 'yes') || 'no' }}]
  [MaaS=${{ (inputs.install-maas && 'yes') || 'no' }}]
  [SERVICE_MESH_TYPE=${{ inputs.mesh-type || 'Core' }}]
  [tests=${{ inputs.run-tests-for || 'all' }}]

on:
  workflow_call:
    inputs:
      core-bootstrap-branch:
        description: 'Branch of core-bootstrap repo'
        required: false
        default: 'main'
        type: string
      test-branch:
        description: 'Branch to look for in core services & test repositories. If branch not found in specific repo, checkout will fallback to main'
        required: false
        default: 'main'
        type: string
      install-maas:
        description: 'Install MaaS'
        required: false
        default: false
        type: boolean
      install-istio:
        description: 'Install Istio'
        required: false
        default: false
        type: boolean
      istio-repo-branch:
        description: 'Branch of the Istio repo'
        required: false
        default: 'main'
        type: string
      core-mesh-config-repo-branch:
        description: 'Branch of the Core Mesh Config repo'
        required: false
        default: 'main'
        type: string
      do-resources-workaround:
        description: 'Do resources workaround'
        required: false
        default: false
        type: boolean
      dummy-separator-0:
        description: '--------------------------------'
        required: false
        default: 'Docker image tags for core components'
        type: string      
      facade-operator-tag:
        description: 'Docker image tag for Facade Operator'
        required: false
        default: 'latest'
        type: string
      ingress-gateway-tag:
        description: 'Docker image tag for Ingress Gateway'
        required: false
        default: 'latest'
        type: string
      control-plane-tag:
        description: 'Docker image tag for Control Plane'
        required: false
        default: 'latest'
        type: string
      paas-mediation-tag:
        description: 'Docker image tag for PaaS Mediation'
        required: false
        default: 'latest'
        type: string
      dbaas-agent-tag:
        description: 'Docker image tag for DBaaS Agent'
        required: false
        default: 'latest'
        type: string
      core-operator-tag:
        description: 'Docker image tag for Core Operator'
        required: false
        default: 'latest'
        type: string
      config-server-tag:
        description: 'Docker image tag for Config Server'
        required: false
        default: 'latest'
        type: string
      site-management-tag:
        description: 'Docker image tag for Site Management'
        required: false
        default: 'latest'
        type: string
      dummy-separator:
        description: '--------------------------------'
        required: false
        default: 'Mesh test services tags'
        type: string
      mesh-test-spring-tag:
        description: 'Docker image tag for Mesh test Spring service'
        required: false
        default: 'latest'
        type: string
      mesh-test-quarkus-tag:  
        description: 'Docker image tag for Mesh test Quarkus service'
        required: false
        default: 'latest'
        type: string
      mesh-test-go-tag:
        description: 'Docker image tag for Mesh test Go service'
        required: false
        default: 'latest'
        type: string        
      dummy-separator-2:
        description: '--------------------------------'
        required: false
        default: 'Run integration tests'
        type: string
      mesh-type:
        description: 'Mesh type for test services — Core or Istio'
        required: false
        default: 'Core'
        type: string
      test-usecase:
        type: string
        required: false
        description: Append to `integration-tests` name - to distiguish results in different mesh modes
      run-tests-for:
        description: 'Integration tests to run: all, none, or comma-separated test names (mesh-tests,paas-mediation,control-plane,site-management,maas-agent)'
        required: false
        default: 'all'
        type: string
      collect-logs-for:
        description: 'Labels of services which logs are required to collect for debugging. Comma-separated label_name=value pairs (name=mesh-test-service-spring-v1,app=control-plane, app.kubernetes.io/name=public-gateway)'
        required: false
        default: ''
        type: string

  workflow_dispatch:
    inputs:
      core-bootstrap-branch:
        description: 'Branch of core-bootstrap repo'
        required: false
        default: 'main'
        type: string
      test-branch:
        description: 'Branch to use in core services & test repositories. If branch not found in specific repo, checkout will fallback to main'
        required: false
        default: 'main'
        type: string        
      install-maas:
        description: 'Install MaaS'
        required: false
        default: false
        type: boolean
      install-istio:
        description: 'Install Istio'
        required: false
        default: false
        type: boolean
      istio-repo-branch:
        description: 'Branch of the Istio repo'
        required: false
        default: 'main'
        type: string
      core-mesh-config-repo-branch:
        description: 'Branch of the Core Mesh Config repo'
        required: false
        default: 'main'
        type: string
      do-resources-workaround:
        description: 'Do resources workaround'
        required: false
        default: false
        type: boolean        
      dummy-separator-0:
        description: '--------------------------------'
        required: false
        default: 'Docker image tags for core components'
        type: string      
      facade-operator-tag:
        description: 'Docker image tag for Facade Operator'
        required: false
        default: 'latest'
        type: string
      ingress-gateway-tag:
        description: 'Docker image tag for Ingress Gateway'
        required: false
        default: 'latest'
        type: string
      control-plane-tag:
        description: 'Docker image tag for Control Plane'
        required: false
        default: 'latest'
        type: string
      paas-mediation-tag:
        description: 'Docker image tag for PaaS Mediation'
        required: false
        default: 'latest'
        type: string
      dbaas-agent-tag:
        description: 'Docker image tag for DBaaS Agent'
        required: false
        default: 'latest'
        type: string
      core-operator-tag:
        description: 'Docker image tag for Core Operator'
        required: false
        default: 'latest'
        type: string
      config-server-tag:
        description: 'Docker image tag for Config Server'
        required: false
        default: 'latest'
        type: string
      site-management-tag:
        description: 'Docker image tag for Site Management'
        required: false
        default: 'latest'
        type: string
      dummy-separator:
        description: '--------------------------------'
        required: false
        default: 'Mesh test services tags'
        type: string
      mesh-test-spring-tag:
        description: 'Docker image tag for Mesh test Spring service'
        required: false
        default: 'latest'
        type: string
      mesh-test-quarkus-tag:  
        description: 'Docker image tag for Mesh test Quarkus service'
        required: false
        default: 'latest'
        type: string
      mesh-test-go-tag:
        description: 'Docker image tag for Mesh test Go service'
        required: false
        default: 'latest'
        type: string        
      dummy-separator-2:
        description: '--------------------------------'
        required: false
        default: 'Run integration tests'
        type: string
      mesh-type:
        description: 'Mesh type for test services — Core or Istio'
        required: false
        default: 'Core'
        type: string
      test-usecase:
        type: string
        required: false
        description: Append to `integration-tests` name - to distiguish results in different mesh modes
      run-tests-for:
        description: 'Integration tests to run: all, none, or comma-separated test names (mesh-tests,paas-mediation,control-plane,site-management,maas-agent)'
        required: false
        default: 'all'
        type: string
      collect-logs-for:
        description: 'Labels of services which logs are required to collect for debugging. Comma-separated label_name=value pairs (name=mesh-test-service-spring-v1,app=control-plane, app.kubernetes.io/name=public-gateway)'
        required: false
        default: ''
        type: string

jobs:
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.integrations_tests_selection.outputs.suites }}

    steps:
      - name: Document workflow input values
        shell: bash
        run: |
          {
            echo "## Workflow input values"
            echo ""
            echo "| Input | Value |"
            echo "| --- | --- |"
            echo "| core-bootstrap-branch | \`${{ inputs.core-bootstrap-branch || 'main' }}\` |"
            echo "| test-branch | \`${{ inputs.test-branch || 'main' }}\` |"
            echo "| install-maas | \`${{ (inputs.install-maas && 'true') || 'false' }}\` |"
            echo "| install-istio | \`${{ (inputs.install-istio && 'true') || 'false' }}\` |"
            echo "| istio-repo-branch | \`${{ inputs.istio-repo-branch || 'main' }}\` |"
            echo "| core-mesh-config-repo-branch | \`${{ inputs.core-mesh-config-repo-branch || 'main' }}\` |"
            echo "| do-resources-workaround | \`${{ (inputs.do-resources-workaround && 'true') || 'false' }}\` |"
            echo "| facade-operator-tag | \`${{ inputs.facade-operator-tag || 'latest' }}\` |"
            echo "| ingress-gateway-tag | \`${{ inputs.ingress-gateway-tag || 'latest' }}\` |"
            echo "| control-plane-tag | \`${{ inputs.control-plane-tag || 'latest' }}\` |"
            echo "| paas-mediation-tag | \`${{ inputs.paas-mediation-tag || 'latest' }}\` |"
            echo "| dbaas-agent-tag | \`${{ inputs.dbaas-agent-tag || 'latest' }}\` |"
            echo "| core-operator-tag | \`${{ inputs.core-operator-tag || 'latest' }}\` |"
            echo "| config-server-tag | \`${{ inputs.config-server-tag || 'latest' }}\` |"
            echo "| site-management-tag | \`${{ inputs.site-management-tag || 'latest' }}\` |"
            echo "| mesh-test-spring-tag | \`${{ inputs.mesh-test-spring-tag || 'latest' }}\` |"
            echo "| mesh-test-quarkus-tag | \`${{ inputs.mesh-test-quarkus-tag || 'latest' }}\` |"
            echo "| mesh-test-go-tag | \`${{ inputs.mesh-test-go-tag || 'latest' }}\` |"
            echo "| mesh-type | \`${{ inputs.mesh-type || 'Core' }}\` |"
            echo "| test-usecase | \`${{ inputs.test-usecase || '' }}\` |"
            echo "| run-tests-for | \`${{ inputs.run-tests-for || 'all' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::group::Workflow input values"
          echo "core-bootstrap-branch=${{ inputs.core-bootstrap-branch || 'main' }}"
          echo "test-branch=${{ inputs.test-branch || 'main' }}"
          echo "install-maas=${{ (inputs.install-maas && 'true') || 'false' }}"
          echo "install-istio=${{ (inputs.install-istio && 'true') || 'false' }}"
          echo "istio-repo-branch=${{ inputs.istio-repo-branch || 'main' }}"
          echo "core-mesh-config-repo-branch=${{ inputs.core-mesh-config-repo-branch || 'main' }}"
          echo "do-resources-workaround=${{ (inputs.do-resources-workaround && 'true') || 'false' }}"
          echo "facade-operator-tag=${{ inputs.facade-operator-tag || 'latest' }}"
          echo "ingress-gateway-tag=${{ inputs.ingress-gateway-tag || 'latest' }}"
          echo "control-plane-tag=${{ inputs.control-plane-tag || 'latest' }}"
          echo "paas-mediation-tag=${{ inputs.paas-mediation-tag || 'latest' }}"
          echo "dbaas-agent-tag=${{ inputs.dbaas-agent-tag || 'latest' }}"
          echo "core-operator-tag=${{ inputs.core-operator-tag || 'latest' }}"
          echo "config-server-tag=${{ inputs.config-server-tag || 'latest' }}"
          echo "site-management-tag=${{ inputs.site-management-tag || 'latest' }}"
          echo "mesh-test-spring-tag=${{ inputs.mesh-test-spring-tag || 'latest' }}"
          echo "mesh-test-quarkus-tag=${{ inputs.mesh-test-quarkus-tag || 'latest' }}"
          echo "mesh-test-go-tag=${{ inputs.mesh-test-go-tag || 'latest' }}"
          echo "mesh-type=${{ inputs.mesh-type || 'Core' }}"
          echo "test-usecase=${{ inputs.test-usecase || '' }}"
          echo "run-tests-for=${{ inputs.run-tests-for || 'all' }}"
          echo "::endgroup::"

      - name: Resolve integration tests to run
        id: integrations_tests_selection
        shell: bash
        env:
          RUN_TESTS_FOR: ${{ inputs.run-tests-for || 'all' }}
        run: |
          all_suites=(mesh-tests paas-mediation control-plane site-management maas-agent)
          normalized="$(echo "$RUN_TESTS_FOR" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]' | tr '_' '-')"

          suites=()
          if [[ -z "$normalized" || "$normalized" == "false" || "$normalized" == "none" ]]; then
            # still deploy the stand, just run no suite on it
            suites=(none)
          elif [[ "$normalized" == "true" || "$normalized" == "all" ]]; then
            suites=("${all_suites[@]}")
          else
            IFS=',' read -ra requested <<< "$normalized"
            for service in "${requested[@]}"; do
              [[ -z "$service" ]] && continue
              if [[ " ${all_suites[*]} " != *" $service "* ]]; then
                echo "::error::Unknown integration test service: $service"
                echo "::error::Allowed values: all, none, ${all_suites[*]}"
                exit 1
              fi
              [[ " ${suites[*]} " == *" $service "* ]] || suites+=("$service")
            done
            [[ ${#suites[@]} -gt 0 ]] || suites=(none)
          fi

          echo "suites=$(printf '%s\n' "${suites[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # every suite gets its own runner and its own stand, so suites no longer compete for CPU, memory and disk
  integration-tests:
    name: integration-tests (${{ matrix.suite }})
    needs: select-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select-tests.outputs.suites) }}
    env:
      ARTIFACT_SUFFIX: ${{ inputs.test-usecase != '' && format('-{0}-{1}', inputs.test-usecase, matrix.suite) || format('-{0}', matrix.suite) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free runner disk space and add swap
        shell: bash
        run: |
          df -h / && free -h
          # Drop preinstalled toolchains the tests never use (~30 GB)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          # Extra 8 GB swap so kind pods don't get OOM-killed on memory spikes
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h / && free -h

      - name: Setup Kind cluster and deploy Cloud Core
        uses: ./.github/actions/setup-kind-with-cloud-core
        with:
          core-bootstrap-branch: ${{ inputs.core-bootstrap-branch }}
          install-maas: ${{ inputs.install-maas || 'false' }}
          install-istio: ${{ inputs.install-istio || 'false' }}
          istio-repo-branch: ${{ inputs.istio-repo-branch }}
          core-mesh-config-repo-branch: ${{ inputs.core-mesh-config-repo-branch }}
          facade-operator-tag: ${{ inputs.facade-operator-tag || 'latest' }}
          ingress-gateway-tag: ${{ inputs.ingress-gateway-tag || 'latest' }}
          control-plane-tag: ${{ inputs.control-plane-tag || 'latest' }}
          paas-mediation-tag: ${{ inputs.paas-mediation-tag || 'latest' }}
          dbaas-agent-tag: ${{ inputs.dbaas-agent-tag || 'latest' }}
          core-operator-tag: ${{ inputs.core-operator-tag || 'latest' }}
          config-server-tag: ${{ inputs.config-server-tag || 'latest' }}
          site-management-tag: ${{ inputs.site-management-tag || 'latest' }}
          test-branch: ${{ inputs.test-branch || 'main' }}
          mesh-type: ${{ inputs.mesh-type || 'Core' }}
          # the action no longer sets a Patroni replica count of its own, and these suites were
          # running against one node
          aux-bootstrap-args: 'PATRONI_REPLICAS_NUMBER=1'

      - name: preserve-cpu-resources-workaround
        if: ${{ inputs.do-resources-workaround }}
        run: |
          # to preserve some resources for tests
          kubectl scale deployment site-management -n core --replicas=0

      - name: Run mesh integration tests (test apps in ${{ inputs.mesh-type || 'Core' }} mesh mode)
        id: mesh_tests
        if: ${{ matrix.suite == 'mesh-tests' }}
        continue-on-error: true
        uses: ./.github/actions/run-mesh-tests
        with:
          mesh-type: ${{ inputs.mesh-type || 'Core' }}
          spring-tag: ${{ inputs.mesh-test-spring-tag || 'latest' }}
          quarkus-tag: ${{ inputs.mesh-test-quarkus-tag || 'latest' }}
          go-tag: ${{ inputs.mesh-test-go-tag || 'latest' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Name mesh tests result with inputs.test-usecase
        if: ${{ matrix.suite == 'mesh-tests' && inputs.test-usecase }}
        run: |
          mv mesh-integration-tests "mesh-tests-${{ inputs.test-usecase }}"

      - name: Run paas-mediation integration tests
        id: paas_tests
        if: ${{ matrix.suite == 'paas-mediation' }}
        continue-on-error: true
        uses: ./.github/actions/run-integrations-tests
        with:
          repository: Netcracker/qubership-core-paas-mediation
          branch: ${{ inputs.test-branch || 'main' }}
          path: ${{ inputs.test-usecase != '' && format('repos/paas-mediation-{0}', inputs.test-usecase) || 'repos/paas-mediation' }}
          test-folder: integration-tests
          test-service-name: paas-mediation-tests
          mesh-type: ${{ inputs.mesh-type || 'Core' }}
          exec-mode: ${{ inputs.install-istio && 'EXEC_IN_POD' || 'PORT_FORWARD' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run control-plane integration tests
        id: control_plane_tests
        if: ${{ matrix.suite == 'control-plane' }}
        continue-on-error: true
        uses: ./.github/actions/run-integrations-tests
        with:
          repository: Netcracker/qubership-core-control-plane
          branch: ${{ inputs.test-branch || 'main' }}
          path: ${{ inputs.test-usecase != '' && format('repos/control-plane-{0}', inputs.test-usecase) || 'repos/control-plane' }}
          test-folder: integration-tests
          test-service-name: control-plane-tests
          mesh-type: ${{ inputs.mesh-type || 'Core' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run site-management integration tests
        id: site_management_tests
        if: ${{ matrix.suite == 'site-management' }}
        continue-on-error: true
        uses: ./.github/actions/run-integrations-tests
        with:
          repository: Netcracker/qubership-core-site-management
          branch: ${{ inputs.test-branch || 'main' }}
          path: ${{ inputs.test-usecase != '' && format('repos/site-management-{0}', inputs.test-usecase) || 'repos/site-management' }}
          test-folder: integration-tests
          test-service-name: site-management-tests
          mesh-type: ${{ inputs.mesh-type || 'Core' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}  

      - name: Run maas-agent integration tests
        id: maas_agent_tests
        if: ${{ matrix.suite == 'maas-agent' }}
        continue-on-error: true
        uses: ./.github/actions/run-integrations-tests
        with:
          repository: Netcracker/qubership-core-maas-agent
          branch: ${{ inputs.test-branch || 'main' }}
          path: ${{ inputs.test-usecase != '' && format('repos/maas-agent-{0}', inputs.test-usecase) || 'repos/maas-agent' }}
          test-folder: integration-tests
          test-service-name: maas-agent-tests
          mesh-type: ${{ inputs.mesh-type || 'Core' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}  

      - name: Aggregate Surefire reports
        run: |
          for module in $(find . -type d -path "*/target/surefire-reports" | sed -E 's#/target/surefire-reports##' | sort -u); do
            
          # Naming strategy: if path starts with ./repos/, take third item (repo name), otherwise use basename
            if [[ "$module" == ./repos/* ]]; then
              modname=$(echo "$module" | cut -d'/' -f3)
            else
              modname=$(basename "$module")
            fi
            echo "Found test reports for module: $module -> artifact: $modname"
            mkdir -p artifacts/$modname
            cp -r "$module/target/surefire-reports" artifacts/$modname/ || true
            if [ -d "$module/target/reports" ]; then
              cp -r "$module/target/reports" artifacts/$modname/ || true
            fi
          done

      - name: Upload Surefire reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/*

      - name: Collect Istio debug info
        if: ${{ inputs.install-istio && (failure() || steps.mesh_tests.outcome == 'failure' || steps.paas_tests.outcome == 'failure' || steps.control_plane_tests.outcome == 'failure' || steps.site_management_tests.outcome == 'failure' || steps.maas_agent_tests.outcome == 'failure') }}
        uses: ./.github/actions/collect-istio-debug-info
        with:
          artifact-suffix: ${{ env.ARTIFACT_SUFFIX }}

      - name: Collect Kubernetes diagnostics
        if: ${{ failure() || steps.mesh_tests.outcome == 'failure' || steps.paas_tests.outcome == 'failure' || steps.control_plane_tests.outcome == 'failure' || steps.site_management_tests.outcome == 'failure' || steps.maas_agent_tests.outcome == 'failure' }}
        uses: ./.github/actions/collect-k8s-diagnostics
        with:
          collect-logs-for: ${{ inputs.collect-logs-for || '' }}
          artifact-suffix: ${{ env.ARTIFACT_SUFFIX }}
