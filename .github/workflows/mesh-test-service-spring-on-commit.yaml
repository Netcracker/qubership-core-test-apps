name: Mesh-test-service-spring build

on:
  push:
    paths:
      - 'mesh-test-service-spring/**'
      - '.github/mesh-test-service-spring-docker-config.json'
      - '.github/workflows/mesh-test-service-spring-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'mesh-test-service-spring/**'
      - '.github/mesh-test-service-spring-docker-config.json'
      - '.github/workflows/mesh-test-service-spring-on-commit.yaml'

jobs:
  mvn:
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@ed95ad948025728db1e613a3e1a4e6a11186f541 # v2.6.2
    with:
      pom-file: mesh-test-service-spring/pom.xml
      # A pull request validates only; main publishes the snapshot.
      maven-command: ${{ github.event_name == 'pull_request' && 'verify' || 'deploy' }}
      # The Docker context is ./artifacts/mesh-test-service-spring/, so the build
      # needs the uploaded Maven artifact.
      upload-artifact: 'true'
      docker-config-file: mesh-test-service-spring-docker-config.json
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets: inherit
