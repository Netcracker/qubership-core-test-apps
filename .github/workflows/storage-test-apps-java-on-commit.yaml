name: Storage-test-apps-java build

# One build for the Java storage test applications: the shared module has to be compiled before
# the applications that depend on it, and the reactor is what guarantees that ordering.

on:
  push:
    paths:
      - 'storage-test-apps-java/**'
      - 'storage-test-service-common/**'
      - 'storage-test-service-spring/**'
      - 'storage-test-service-quarkus/**'
      - '.github/storage-test-service-spring-docker-config.json'
      - '.github/storage-test-service-quarkus-docker-config.json'
      - '.github/workflows/storage-test-apps-java-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'storage-test-apps-java/**'
      - 'storage-test-service-common/**'
      - 'storage-test-service-spring/**'
      - 'storage-test-service-quarkus/**'
      - '.github/storage-test-service-spring-docker-config.json'
      - '.github/storage-test-service-quarkus-docker-config.json'
      - '.github/workflows/storage-test-apps-java-on-commit.yaml'

jobs:
  mvn:
    uses: netcracker/qubership-core-infra/.github/workflows/maven-build-with-sonar.yaml@32a5b506971a029acc41bc69fd42d06137caeb36 # v1.3.3
    with:
      event-name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      upload-artifact: true
      pom-file-path: storage-test-apps-java/pom.xml
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  docker-build-spring:
    needs: [mvn]
    uses: netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@32a5b506971a029acc41bc69fd42d06137caeb36 # v1.3.3
    with:
      dry-run: false
      config-filename: storage-test-service-spring-docker-config.json

  docker-build-quarkus:
    needs: [mvn]
    uses: netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@32a5b506971a029acc41bc69fd42d06137caeb36 # v1.3.3
    with:
      dry-run: false
      config-filename: storage-test-service-quarkus-docker-config.json
