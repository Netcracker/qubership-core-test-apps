name: Consul-login-test-service-go build

on:
  push:
    paths:
      - 'consul-login/test-service-go/**'
      - '.github/workflows/consul-login-test-service-go-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'consul-login/test-service-go/**'
      - '.github/workflows/consul-login-test-service-go-on-commit.yaml'

jobs:
  build:
    uses: netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@91f0316488bc6ab88d060261caa1ebddd6706094 # v2.7.0
    with:
      go-module-dir: consul-login/test-service-go/test-service-go
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      ref: ${{ github.ref }}
      skip-docker: true
    secrets: inherit
