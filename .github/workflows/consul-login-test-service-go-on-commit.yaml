name: Consul-login-test-service-go build

on:
  push:
    paths:
      - 'consul-login/test-service-go/**'
      - '.github/workflows/consul-login-test-service-go-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'consul-login/test-service-go/**'
      - '.github/workflows/consul-login-test-service-go-on-commit.yaml'

jobs:
  build:
    uses: netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@8a233b03c5b5355d59c1585ffdaa1f45ea816405 # v2.6.1
    with:
      go-module-dir: consul-login/test-service-go/test-service-go
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      ref: ${{ github.ref }}
      skip-docker: true
    secrets: inherit
