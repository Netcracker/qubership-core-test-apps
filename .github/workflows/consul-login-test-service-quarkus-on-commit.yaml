name: Consul-login-test-service-quarkus build

on:
  push:
    paths:
      - 'consul-login-test-service-quarkus/**'
      - '.github/consul-login-test-service-quarkus-docker-config.json'
      - '.github/workflows/consul-login-test-service-quarkus-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'consul-login-test-service-quarkus/**'
      - '.github/consul-login-test-service-quarkus-docker-config.json'
      - '.github/workflows/consul-login-test-service-quarkus-on-commit.yaml'
jobs:
  build:
    uses: netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@e8322e6ee168795edec1d103e289b3fe3ceb805d # v2.6.0
    with:
      maven-command: 'verify'
      pom-file: consul-login-test-service-quarkus/pom.xml
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      ref: ${{ github.ref }}
      docker-config-file: consul-login-test-service-quarkus-docker-config.json
    secrets: inherit
