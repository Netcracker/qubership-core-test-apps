name: Mesh-integration-tests build

on:
  push:
    paths:
      - 'mesh-integration-tests/**'
      - '.github/workflows/mesh-integration-tests-on-commit.yaml'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'mesh-integration-tests/**'
      - '.github/workflows/mesh-integration-tests-on-commit.yaml'

jobs:
  mvn:
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@91f0316488bc6ab88d060261caa1ebddd6706094 # v2.7.0
    with:
      pom-file: mesh-integration-tests/pom.xml
      # A pull request validates only; main publishes the snapshot.
      maven-command: ${{ github.event_name == 'pull_request' && 'verify' || 'deploy' }}
      upload-artifact: 'false'
      # Test module — there is no image to build.
      skip-docker: true
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets: inherit
