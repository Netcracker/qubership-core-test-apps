{{- if eq .Values.SERVICE_MESH_TYPE "Istio" }}
# Istio counterpart of the Core composite-gateway circuitBreaker (maxConnections: 2): the composite routes
# (mesh-test-app-gateway-spring-routes) target this dedicated host, so the limit does not reach the
# public/private gateways or other DestinationRules on {{ .Values.DEPLOYMENT_RESOURCE_NAME }}.
---
kind: Service
apiVersion: v1
metadata:
  name: '{{ .Values.DEPLOYMENT_RESOURCE_NAME }}-cb'
  labels:
    app.kubernetes.io/part-of: 'mesh-test-app'
    app.kubernetes.io/name: '{{ .Values.SERVICE }}'
spec:
  ports:
    - name: web
      port: 8080
      targetPort: 8080
  selector:
    name: '{{ .Values.DEPLOYMENT_RESOURCE_NAME }}'
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: '{{ .Values.DEPLOYMENT_RESOURCE_NAME }}-cb'
  labels:
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/name: '{{ .Values.SERVICE }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
  host: '{{ .Values.DEPLOYMENT_RESOURCE_NAME }}-cb'
  trafficPolicy:
    connectionPool:
      tcp:
        # excess HTTP/1.1 requests wait as pending, as in Core; http2MaxRequests would reject them with 503
        maxConnections: 2
{{- end }}
