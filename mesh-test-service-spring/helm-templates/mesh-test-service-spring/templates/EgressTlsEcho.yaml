{{- if .Values.EGRESS_TLS_TESTS_ENABLED }}
# Simulated external HTTPS site for the egress TLS tests.
#
# Deployed identically on both mesh types: it is the *target* of egress traffic,
# not a mesh resource, so nothing here is guarded by SERVICE_MESH_TYPE. The mesh
# reaches it under the fake external names *.external.test, which the install
# script maps onto this Service with a CoreDNS rewrite.
#
# nginx picks the server block - and therefore the server certificate - by SNI,
# so a gateway that originates TLS with the wrong SNI gets a 421 instead of a
# body. The JSON it answers with reports back what the "external site" actually
# saw: SNI, Host header, path, and the client certificate, if any.
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-tls-echo-certs
  labels:
    app.kubernetes.io/part-of: 'mesh-test-app'
    app.kubernetes.io/name: '{{ .Values.SERVICE }}'
type: Opaque
stringData:
  ca.crt: |
{{ .Files.Get "files/egress-tls/ca.crt" | indent 4 }}
  server.crt: |
{{ .Files.Get "files/egress-tls/server.crt" | indent 4 }}
  server.key: |
{{ .Files.Get "files/egress-tls/server.key" | indent 4 }}
  rogue-server.crt: |
{{ .Files.Get "files/egress-tls/rogue-server.crt" | indent 4 }}
  rogue-server.key: |
{{ .Files.Get "files/egress-tls/rogue-server.key" | indent 4 }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: egress-tls-echo
  labels:
    name: egress-tls-echo
    app.kubernetes.io/part-of: 'mesh-test-app'
    app.kubernetes.io/name: '{{ .Values.SERVICE }}'
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.RC_REVISIONS }}
  selector:
    matchLabels:
      name: egress-tls-echo
  template:
    metadata:
      labels:
        name: egress-tls-echo
        app.kubernetes.io/part-of: 'mesh-test-app'
      annotations:
        # Rolls the pod when a certificate or the nginx config changes. Hashing
        # the ConfigMap by path keeps the two from drifting.
        egress-tls-echo/config-checksum: '{{ printf "%s%s%s%s" (include (print $.Template.BasePath "/EgressTlsEchoConfig.yaml") .) (.Files.Get "files/egress-tls/server.crt") (.Files.Get "files/egress-tls/rogue-server.crt") (.Files.Get "files/egress-tls/ca.crt") | sha256sum }}'
    spec:
      containers:
      - name: egress-tls-echo
        image: '{{ .Values.EGRESS_ECHO_IMAGE }}'
        command: ["nginx", "-c", "/etc/nginx/egress/nginx.conf", "-g", "daemon off;"]
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/egress
          readOnly: true
        - name: certs
          mountPath: /etc/egress-tls
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 8443
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: nginx-conf
        configMap:
          name: egress-tls-echo
      - name: certs
        secret:
          secretName: egress-tls-echo-certs
---
apiVersion: v1
kind: Service
metadata:
  name: egress-tls-echo
  labels:
    app.kubernetes.io/part-of: 'mesh-test-app'
    app.kubernetes.io/name: '{{ .Values.SERVICE }}'
spec:
  type: ClusterIP
  selector:
    name: egress-tls-echo
  ports:
  - name: https
    port: 8443
    targetPort: 8443
    protocol: TCP
{{- end }}
