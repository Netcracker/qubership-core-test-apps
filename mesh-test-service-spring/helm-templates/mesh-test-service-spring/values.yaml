PAAS_PLATFORM: "KUBERNETES"
# headers allowed for forwarding
ALLOWED_HEADERS: '' # TO_BE_REPLACED
CPU_REQUEST: "100m"
CPU_LIMIT: "1"
MEMORY_LIMIT: '360Mi'
# Openshift custom host name
CUSTOM_HOST: '' # TO_BE_REPLACED
# Host:Port for central glow root
GLOWROOT_CLUSTER: "glowroot:8181"
# Docker repository with images
IMAGE_REPOSITORY: 'ghcr.io/netcracker/qubership-core-mesh-test-service-spring'
TAG: 'latest'
# Service Name. For example: contact-management-backend
SERVICE: 'mesh-test-service-spring'
SERVICE_NAME: 'mesh-test-service-spring'
APPLICATION_NAME: 'mesh-test-app'
DEPLOYMENT_VERSION: "v1"
DEPLOYMENT_RESOURCE_NAME: 'mesh-test-service-spring-v1'
# Private gateway url
PRIVATE_GATEWAY_URL: '' # TO_BE_REPLACED
# Public gateway url
PUBLIC_GATEWAY_URL: '' # TO_BE_REPLACED
# revisionHistoryLimit value for DC
RC_REVISIONS: 3
REPLICAS: 1
# Openshift server host name
SERVER_HOSTNAME: '' # TO_BE_REPLACED 
# Number of IO threads in Undertow server
XNIO_IO_THREAD: 14
# Number of working threads in Undertow server
XNIO_WORK_THREAD: 112
# Additional params to pass to Java process
X_JAVA_ARGS: '' # TO_BE_REPLACED
# Flag to install dashboard and podmonitor
MONITORING_INSTALL: false
CLOUD_TOPOLOGY_KEY: kubernetes.io/hostname
INGRESS_GATEWAY_NAME: "test-ingress-gateway"
DEPLOY_SECOND_INGRESS: false
INGRESS_GATEWAY_NAME_SECOND: "test-ingress-gateway-2"
PEER_NAMESPACE: ""
INGRESS_CLASS: ""
K8S_SERVICE_TYPE: 'HEADLESS'
CLOUD_PUBLIC_HOST: "svc.cluster.local"
CLOUD_PRIVATE_HOST: "svc.cluster.local"
CR_SYNCHRONIZER_IMAGE: "ghcr.io/netcracker/cr-synchronizer:latest@sha256:ac6ecdf870c09406817114efca2dfffcbe41e667c854ffba7879a0eed67df8da"
EXTERNAL_IPS: '' # TO_BE_REPLACED
DEPLOYMENT_SESSION_ID:
RESOURCE_POLLING_TIMEOUT: 60
SERVICE_MESH_TYPE: "Core"
CONSUL_ENABLED: false
CONSUL_URL: ''

# Egress Blue/Green tests: header-based routing on the egress gateway between a
# production endpoint and its stub, selected by x-version-name. Deploys the two
# endpoints and the egress routes; see mesh-test-install/egress-bg/README.md.
EGRESS_BG_TESTS_ENABLED: true
# Renders the production endpoint of /egress-bg/integration. A candidate deployment
# sets it to false so that a request which lost its x-version-name on the way fails
# instead of reaching production.
EGRESS_PROD_INTEGRATION_ENABLED: true

# Egress TLS tests: deploy the simulated external HTTPS site and the egress TLS
# mesh resources. Requires the *.external.test CoreDNS rewrite that
# mesh-test-install/mesh-test-apps.sh installs.
EGRESS_TLS_TESTS_ENABLED: true

# Image serving the simulated external site for egress tests. Any nginx that runs as non-root and
# reads its config from -c will do; override to point at an internal mirror.
EGRESS_ECHO_IMAGE: 'nginxinc/nginx-unprivileged:1.31-alpine@sha256:6a23acdfca2b9cfbcec61419e3f1426bcbedb91362f2f19306a8567423bb4612'
